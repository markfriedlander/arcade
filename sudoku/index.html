<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Classic sudoku. No hints, no lives, no way to lose a puzzle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%237fb069' stroke-width='2'%3E%3Crect x='4' y='4' width='24' height='24' rx='2'/%3E%3Cpath d='M12 4v24M20 4v24M4 12h24M4 20h24' stroke-width='1.2'/%3E%3C/g%3E%3C/svg%3E">
<title>Sudoku</title>
<style>
  /* ============================================================
     SUDOKU: the classic one, for the browser.

     No hints, no lives, no currency, no way to lose. A wrong digit
     is marked so it can be found and fixed and costs nothing else.
     ============================================================ */
  :root {
    --bg: #0b0a09;
    --surface: #16130f;
    --text: #ece7de;
    --muted: #948b7e;
    --accent: #7fb069;
    --accent-glow: #a9d195;
    --sand: #c8b28a;
    --border: #262119;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  body {
    background:
      radial-gradient(ellipse 90% 45% at 50% 4%, rgba(127,176,105,0.07) 0%, rgba(127,176,105,0) 62%),
      var(--bg);
    display: flex; flex-direction: column;
  }

  #bar {
    flex: 0 0 auto; width: 100%; max-width: 560px; margin: 0 auto 0.2rem;
    display: flex; align-items: center; gap: 0.85rem;
    padding: calc(env(safe-area-inset-top, 0px) + 0.7rem) 0.5rem 0.5rem;
  }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat .k { font-size: 0.56rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.16em; }
  .stat .v { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.sub .v { color: var(--sand); font-size: 0.95rem; font-weight: 500; }
  #spacer { flex: 1; }
  #tierName {
    font-size: 0.6rem; color: var(--muted); letter-spacing: 0.16em;
    border: 1px solid var(--border); border-radius: 7px; padding: 0.3rem 0.5rem;
  }

  .btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; font: inherit; font-size: 0.85rem;
    padding: 0.45rem 0.7rem; cursor: pointer;
    transition: border-color .15s ease, color .15s ease, opacity .15s ease, background .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.3; cursor: default; border-color: var(--border); color: var(--muted); }
  .btn.icon { padding: 0.4rem 0.6rem; min-width: 2.2rem; font-size: 0.95rem; line-height: 1.1; }
  #sound.on { border-color: var(--accent); color: var(--accent); }
  #sound.off { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

  /* Shrink to the board rather than growing, so the keypad sits under it
     instead of being flung to the bottom of a tall screen. */
  #wrap {
    flex: 1 1 auto; min-height: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 0 0.4rem;
  }
  canvas { display: block; touch-action: none; }

  #tools {
    display: flex; justify-content: center; gap: clamp(0.9rem, 4.5vw, 2.2rem);
    padding: 0.7rem 0 0.4rem;
  }
  #tools .tool {
    background: none; border: none; cursor: pointer; font: inherit;
    color: var(--muted); display: flex; flex-direction: column;
    align-items: center; gap: 0.25rem; min-width: 3.4rem; padding: 0 0.2rem;
    transition: color .15s ease;
  }
  #tools .tool:hover { color: var(--sand); }
  #tools .tool:disabled { opacity: 0.32; cursor: default; }
  #tools .tool.on { color: var(--accent); }
  #tools .tool .g { font-size: 1.2rem; line-height: 1; }
  #tools .tool .l { font-size: 0.66rem; letter-spacing: 0.04em; white-space: nowrap; }

  #keypad {
    display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px;
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: 0 0.4rem calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
  }
  #keypad button {
    font: inherit; font-size: 1.45rem; font-weight: 400;
    height: 3rem; cursor: pointer;
    color: var(--sand); background: rgba(236,231,222,0.045);
    border: 1px solid var(--border); border-radius: 9px;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  #keypad button:hover:not(:disabled) { background: rgba(200,178,138,0.12); }
  #keypad button.done { opacity: 0.22; cursor: default; }

  #veil {
    position: fixed; inset: 0; background: rgba(11,10,9,0.9);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center;
    padding: 1.4rem; z-index: 10; overflow-y: auto;
  }
  #veil.on { display: flex; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 1.8rem 1.6rem;
    max-width: 22rem; width: 100%; text-align: center;
  }
  .card h1 { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
  .card .sub { font-style: italic; color: var(--accent); font-size: 1rem; margin-bottom: 1.2rem; }
  .card p.body { color: var(--muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 1.2rem; }
  .card p.body b { color: var(--text); font-weight: 500; }

  .tiers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
  .tiers .btn { padding: 0.6rem 0.3rem; font-size: 0.88rem; }
  .tiers .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(127,176,105,0.07); }
  .tiers .btn small { display: block; font-size: 0.66rem; opacity: 0.6; margin-top: 0.12rem; }

  .opts { border-top: 1px solid var(--border); margin-top: 1.1rem; padding-top: 0.9rem; text-align: left; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 0.3rem 0; }
  .opt span { font-size: 0.87rem; color: var(--muted); }
  .opt button {
    font: inherit; font-size: 0.78rem; cursor: pointer;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 0.2rem 0.6rem; min-width: 3rem;
  }
  .opt button.on { border-color: var(--accent); color: var(--accent); }

  .rowbtns { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 1.1rem; }
  .rowbtns .btn { padding: 0.72rem; font-size: 0.95rem; }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(127,176,105,0.08); color: var(--accent-glow); }
  .card .back {
    display: inline-block; margin-top: 1.2rem; color: var(--muted);
    font-size: 0.85rem; text-decoration: none; transition: color .15s ease;
  }
  .card .back:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="bar">
  <div class="stat"><span class="k">Left</span><span class="v" id="clues">0</span></div>
  <div class="stat sub"><span class="k">Wrong</span><span class="v" id="mistakes">0</span></div>
  <div class="stat sub"><span class="k">Time</span><span class="v" id="clock">0:00</span></div>
  <div id="spacer"></div>
  <span id="tierName">GENTLE</span>
  <button class="btn icon" id="sound" title="Sound" aria-label="Sound">&#9834;</button>
  <button class="btn" id="menu">Menu</button>
</div>

<div id="wrap"><canvas id="cv"></canvas></div>

<div id="tools">
  <button class="tool" id="undo"><span class="g">&#8630;</span><span class="l">Undo</span></button>
  <button class="tool" id="erase"><span class="g">&#9003;</span><span class="l">Erase</span></button>
  <button class="tool" id="notesBtn"><span class="g">&#9998;</span><span class="l">Notes</span></button>
  <button class="tool" id="clearNotes"><span class="g">&#8856;</span><span class="l">Clear notes</span></button>
</div>

<div id="keypad"></div>

<div id="veil" class="on">
  <div class="card">
    <h1 id="ttl">Sudoku</h1>
    <p class="sub" id="sttl">Nothing to lose.</p>
    <p class="body" id="msg">
      Every puzzle here can be finished by <b>reasoning alone</b>. None of them
      ever require a guess.<br><br>
      No hints, no lives, no currency. A wrong digit is marked so you can find it
      and fix it, and costs you nothing else.
    </p>
    <div class="tiers" id="tiers"></div>
    <div class="rowbtns">
      <button class="btn primary" id="play">Play</button>
    </div>
    <div class="opts" id="opts"></div>
    <a class="back" href="../">&larr; Arcade</a>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   A classic sudoku engine, small on purpose.

   The heavy machinery in the Swift version exists for killer: cages,
   the rule of 45, proving a cage layout can be solved without ever
   guessing. Plain sudoku is the easy case. You take a finished grid
   and delete clues for as long as it still has exactly one answer,
   which is a directed process that converges, so none of that is
   needed here.

   What is kept is the part that decides difficulty: a puzzle is
   graded by the hardest technique it forces you to reach for, and
   nothing is published that cannot be finished by reasoning alone.
   ============================================================ */

const ALL = 0b11_1111_1110;                       // bits 1..9
const bit = d => 1 << d;
const count = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
const lowest = m => 31 - Math.clz32(m & -m);

const UNITS = [];
for (let r = 0; r < 9; r++) UNITS.push([...Array(9)].map((_, c) => r * 9 + c));
for (let c = 0; c < 9; c++) UNITS.push([...Array(9)].map((_, r) => r * 9 + c));
for (let b = 0; b < 9; b++) {
  const br = ((b / 3) | 0) * 3, bc = (b % 3) * 3;
  UNITS.push([...Array(9)].map((_, i) => (br + ((i / 3) | 0)) * 9 + bc + (i % 3)));
}
const ROW = i => (i / 9) | 0, COL = i => i % 9, BOX = i => ((i / 27) | 0) * 3 + ((i % 9) / 3 | 0);
const UNITS_OF = [...Array(81)].map((_, i) => [UNITS[ROW(i)], UNITS[9 + COL(i)], UNITS[18 + BOX(i)]]);
const PEERS = [...Array(81)].map((_, i) => {
  const s = new Set();
  for (const u of UNITS_OF[i]) for (const c of u) s.add(c);
  s.delete(i);
  return [...s];
});

/* Techniques in the order a person reaches for them. Difficulty is the
   hardest one a puzzle forces, which is how every serious grader works. */
const TECHNIQUES = ["Naked single", "Hidden single", "Pointing", "Box line",
                    "Naked pair", "Hidden pair", "Naked triple", "Hidden triple"];
const T = { NS: 0, HS: 1, POINT: 2, BOXLINE: 3, NP: 4, HP: 5, NT: 6, HT: 7 };

function rngFrom(seed) {
  let s = (seed >>> 0) + 0x9E3779B9;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(a, rnd) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- candidate state ---------- */
function freshState(givens, log) {
  const cand = new Int16Array(81).fill(ALL);
  const val = new Uint8Array(81);
  const isGiven = new Uint8Array(81);
  for (let i = 0; i < 81; i++) if (givens[i]) isGiven[i] = 1;
  const st = { cand, val, filled: 0, isGiven };
  for (let i = 0; i < 81; i++) {
    const g = givens[i];
    if (!g) continue;
    if (!(cand[i] & bit(g))) return null;
    // The log has to be threaded through here. Without it an easy puzzle,
    // which the opening propagation solves outright, records no technique at
    // all and grades as having needed nothing.
    if (!assign(st, i, g, log)) return null;
  }
  return st;
}

/* Worklist rather than recursion, so a long cascade cannot run the stack out. */
function assign(st, cell, d, log) {
  const pending = [];
  let others = st.cand[cell] & ~bit(d);
  while (others) { const o = lowest(others); others &= others - 1; pending.push(cell, o); }
  return drain(st, pending, log || null);
}

function drain(st, pending, log) {
  while (pending.length) {
    const d = pending.pop(), cell = pending.pop();
    if (!(st.cand[cell] & bit(d))) continue;
    st.cand[cell] &= ~bit(d);
    const rem = st.cand[cell];
    if (!rem) return false;

    if (count(rem) === 1 && !st.val[cell]) {
      const only = lowest(rem);
      st.val[cell] = only;
      st.filled++;
      if (log && !st.isGiven[cell]) log[T.NS]++;
      for (const p of PEERS[cell]) if (st.cand[p] & bit(only)) pending.push(p, only);
    }
    for (const unit of UNITS_OF[cell]) {
      let place = -1, n = 0;
      for (const c of unit) if (st.cand[c] & bit(d)) { place = c; if (++n > 1) break; }
      if (n === 0) return false;
      if (n === 1 && !st.val[place]) {
        if (log && !st.isGiven[place]) log[T.HS]++;
        let o = st.cand[place] & ~bit(d);
        while (o) { const x = lowest(o); o &= o - 1; pending.push(place, x); }
      }
    }
  }
  return true;
}

/* ---------- counting search, only for proving uniqueness ---------- */
function countSolutions(givens, limit) {
  const st = freshState(givens);
  if (!st) return 0;
  return search(st, limit);
}
function search(st, limit) {
  let best = -1, bc = 10;
  for (let i = 0; i < 81; i++) {
    if (st.val[i]) continue;
    const n = count(st.cand[i]);
    if (n < bc) { bc = n; best = i; if (n === 2) break; }
  }
  if (best === -1) return 1;
  let found = 0;
  let m = st.cand[best];
  while (m) {
    const d = lowest(m); m &= m - 1;
    const next = { cand: st.cand.slice(), val: st.val.slice(), filled: st.filled, isGiven: st.isGiven };
    if (assign(next, best, d)) {
      found += search(next, limit - found);
      if (found >= limit) return found;
    }
  }
  return found;
}

/* ---------- techniques beyond singles ---------- */
function eliminate(st, pending, cell, d) {
  if (st.cand[cell] & bit(d)) { pending.push(cell, d); return true; }
  return false;
}

function lineBox(st, pending, log) {
  let fired = false;
  for (let b = 0; b < 9; b++) {
    const box = UNITS[18 + b];
    for (let d = 1; d <= 9; d++) {
      const homes = box.filter(c => !st.val[c] && (st.cand[c] & bit(d)));
      if (!homes.length) continue;
      if (homes.every(c => ROW(c) === ROW(homes[0]))) {
        for (const c of UNITS[ROW(homes[0])]) {
          if (BOX(c) !== b && !st.val[c] && eliminate(st, pending, c, d)) fired = true;
        }
      }
      if (homes.every(c => COL(c) === COL(homes[0]))) {
        for (const c of UNITS[9 + COL(homes[0])]) {
          if (BOX(c) !== b && !st.val[c] && eliminate(st, pending, c, d)) fired = true;
        }
      }
    }
  }
  if (fired) { log[T.POINT]++; return true; }

  for (let u = 0; u < 18; u++) {
    const line = UNITS[u];
    for (let d = 1; d <= 9; d++) {
      const homes = line.filter(c => !st.val[c] && (st.cand[c] & bit(d)));
      if (!homes.length) continue;
      const b = BOX(homes[0]);
      if (!homes.every(c => BOX(c) === b)) continue;
      const onLine = new Set(line);
      for (const c of UNITS[18 + b]) {
        if (!onLine.has(c) && !st.val[c] && eliminate(st, pending, c, d)) fired = true;
      }
    }
  }
  if (fired) log[T.BOXLINE]++;
  return fired;
}

function combos(items, k, fn) {
  const idx = [...Array(k)].map((_, i) => i);
  if (items.length < k) return;
  for (;;) {
    fn(idx.map(i => items[i]));
    let i = k - 1;
    while (i >= 0 && idx[i] === items.length - k + i) i--;
    if (i < 0) return;
    idx[i]++;
    for (let j = i + 1; j < k; j++) idx[j] = idx[j - 1] + 1;
  }
}

function nakedSubset(st, pending, k, log) {
  let fired = false;
  for (const unit of UNITS) {
    const open = unit.filter(c => !st.val[c] && count(st.cand[c]) > 1);
    if (open.length <= k) continue;
    combos(open, k, group => {
      let u = 0;
      for (const c of group) u |= st.cand[c];
      if (count(u) !== k) return;
      const inGroup = new Set(group);
      for (const c of open) {
        if (inGroup.has(c)) continue;
        let share = st.cand[c] & u;
        while (share) { const d = lowest(share); share &= share - 1; if (eliminate(st, pending, c, d)) fired = true; }
      }
    });
  }
  if (fired) log[k === 2 ? T.NP : T.NT]++;
  return fired;
}

function hiddenSubset(st, pending, k, log) {
  let fired = false;
  for (const unit of UNITS) {
    const open = unit.filter(c => !st.val[c]);
    if (open.length <= k) continue;
    const digits = [];
    for (let d = 1; d <= 9; d++) if (open.some(c => st.cand[c] & bit(d))) digits.push(d);
    if (digits.length <= k) continue;
    combos(digits, k, group => {
      let mask = 0;
      for (const d of group) mask |= bit(d);
      const homes = open.filter(c => st.cand[c] & mask);
      if (homes.length !== k) return;
      for (const d of group) if (!homes.some(c => st.cand[c] & bit(d))) return;
      for (const c of homes) {
        let extra = st.cand[c] & ~mask;
        while (extra) { const d = lowest(extra); extra &= extra - 1; if (eliminate(st, pending, c, d)) fired = true; }
      }
    });
  }
  if (fired) log[k === 2 ? T.HP : T.HT]++;
  return fired;
}

/* ---------- solving by reasoning alone ----------
   Returning solved is itself a proof of uniqueness: every step was
   forced, so no other grid can satisfy the clues. Techniques are tried
   cheapest first and the loop restarts whenever one fires, so a puzzle
   is only credited with a hard technique when the easy ones genuinely
   had nothing left to say. */
function solveLogically(givens, witness) {
  const log = new Array(TECHNIQUES.length).fill(0);
  const st = freshState(givens, log);
  if (!st) return { solved: false, log, hardest: -1, unsound: false };

  const bad = () => witness && [...Array(81).keys()].some(c => !(st.cand[c] & bit(witness[c])));
  if (bad()) return { solved: false, log, hardest: -1, unsound: true };

  while (st.filled < 81) {
    const pending = [];
    const fired = lineBox(st, pending, log)
      || nakedSubset(st, pending, 2, log)
      || hiddenSubset(st, pending, 2, log)
      || nakedSubset(st, pending, 3, log)
      || hiddenSubset(st, pending, 3, log);
    if (!fired) break;                      // out of ideas, and never guessing
    if (!drain(st, pending, log)) return { solved: false, log, hardest: -1, unsound: false };
    if (bad()) return { solved: false, log, hardest: -1, unsound: true };
  }

  let hardest = -1;
  for (let i = 0; i < log.length; i++) if (log[i] > 0) hardest = i;
  return { solved: st.filled === 81, log, hardest, unsound: false, grid: Array.from(st.val) };
}

/* ---------- generation ---------- */
function solvedGrid(rnd) {
  const grid = new Uint8Array(81);
  const cand = new Int16Array(81).fill(ALL);
  (function fill(i) {
    if (i === 81) return true;
    const ds = [];
    let m = cand[i];
    while (m) { const d = lowest(m); m &= m - 1; ds.push(d); }
    shuffle(ds, rnd);
    for (const d of ds) {
      const saved = cand.slice();
      grid[i] = d;
      let ok = true;
      for (const p of PEERS[i]) {
        if (p <= i) continue;
        cand[p] &= ~bit(d);
        if (!cand[p]) { ok = false; break; }
      }
      if (ok && fill(i + 1)) return true;
      cand.set(saved);
    }
    grid[i] = 0;
    return false;
  })(0);
  return grid;
}

/* A tier is a ceiling on the hardest technique a puzzle may demand, plus a
   target number of clues. Nothing is published that needs a guess.
   
   Both are needed. Technique alone does not separate the tiers well, because
   triples are genuinely rare in minimal classic sudoku: carving to the fewest
   possible clues still only demands one about a quarter of the time, so a tier
   defined by them misses its target more often than it hits it. Clue count is
   also what a player actually perceives as difficulty, and it is reliable. */
const TIERS = [
  { name: "Gentle",   clues: 38, ceiling: T.HS },
  { name: "Moderate", clues: 32, ceiling: T.BOXLINE },
  { name: "Tricky",   clues: 28, ceiling: T.HP },
  { name: "Severe",   clues: 23, ceiling: T.HT }
];

function generate(tierIdx, seed) {
  const rnd = rngFrom(seed);
  const tier = TIERS[tierIdx];
  let fallback = null, best = null, qualifying = 0;

  for (let attempt = 0; attempt < 60; attempt++) {
    const solution = solvedGrid(rnd);
    const givens = Uint8Array.from(solution);
    const order = shuffle([...Array(81).keys()], rnd);

    // Carve clues away for as long as exactly one answer survives, stopping at
    // the tier's clue target or as soon as the puzzle would demand something
    // harder than the tier allows, whichever comes first.
    let remaining = 81;
    for (const cell of order) {
      if (remaining <= tier.clues) break;
      if (!givens[cell]) continue;
      const keep = givens[cell];
      givens[cell] = 0;
      if (countSolutions(givens, 2) !== 1) { givens[cell] = keep; continue; }
      const r = solveLogically(givens);
      if (!r.solved || r.hardest > tier.ceiling) { givens[cell] = keep; continue; }
      remaining--;
    }

    const r = solveLogically(givens, solution);
    if (!r.solved || r.unsound) continue;
    const clues = Array.from(givens).filter(Boolean).length;
    const puzzle = {
      givens: Array.from(givens), solution: Array.from(solution),
      hardest: r.hardest, tier: tierIdx, clues
    };
    // Close enough to the clue target counts; an exact landing is not worth
    // waiting for. Among puzzles that qualify, prefer one that actually demands
    // the techniques its tier is named for, since carving to a clue count alone
    // frequently lands on a sparse grid that still only needs hidden singles.
    if (clues <= tier.clues + 2) {
      if (!best || puzzle.hardest > best.hardest) best = puzzle;
      if (best.hardest >= tier.ceiling) return best;      // cannot do better
      if (++qualifying >= 8) return best;
    } else if (!fallback || clues < fallback.clues) {
      fallback = puzzle;
    }
  }
  return best || fallback;
}

if (typeof window !== "undefined") {
  window.SudokuEngine = {
    generate, solveLogically, countSolutions, solvedGrid, rngFrom,
    TIERS, TECHNIQUES, UNITS, PEERS, ROW, COL, BOX, bit, count, lowest
  };
}

<script>
"use strict";
/* ============================================================
   Sudoku, the playing half.

   Deliberately absent: hints, lives, currencies, and any way to lose.
   A wrong digit is marked so it can be found and fixed, and costs
   nothing else. The clock and the mistake count are part of playing a
   puzzle, so they are shown, and either can be switched off.
   ============================================================ */

const E = window.SudokuEngine;

/* ---------- state ---------- */
let puzzle = null;
let entries = new Uint8Array(81);
let notes = new Int16Array(81);
let selection = -1;
let notesMode = false;
let mistakes = 0;
let elapsed = 0, lastTick = 0, finished = false;
let history = [];
let tier = 0, seedCounter = 1;
let running = false;
let flash = null;                  // {cell, t} for a wrong entry
const DEFAULTS = { clock: true, mistakes: true, check: true, highlights: true };
let settings = Object.assign({}, DEFAULTS);

const isGiven = c => puzzle.givens[c] !== 0;
const isWrong = c => entries[c] !== 0 && entries[c] !== puzzle.solution[c];
const solved = () => puzzle && entries.every((v, i) => v === puzzle.solution[i]);

/* ---------- canvas ---------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");
let S = 40, PAD = 0, W = 0, H = 0, dpr = 1;

function resize() {
  const r = wrap.getBoundingClientRect();
  const avail = Math.max(200, Math.min(r.width, r.height, 560));
  S = Math.floor((avail - 8) / 9);
  PAD = 4;
  W = H = S * 9 + PAD * 2;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const WRONG = "#dd5346";

const cellX = c => PAD + (c % 9) * S;
const cellY = c => PAD + ((c / 9) | 0) * S;

function render(now) {
  if (!puzzle) return;
  ctx.clearRect(0, 0, W, H);

  const selVal = selection >= 0 ? entries[selection] : 0;
  const peers = selection >= 0 && settings.highlights ? new Set(E.PEERS[selection]) : null;

  for (let c = 0; c < 81; c++) {
    // Every box gets the same ground. The 3x3 blocks are already told apart
    // by their heavier borders, so shading alternate ones only added motion.
    let fill = "rgba(236,231,222,0.030)";
    if (selection >= 0) {
      if (c === selection) fill = "rgba(200,178,138,0.17)";
      else if (settings.highlights) {
        if (selVal && entries[c] === selVal) fill = "rgba(200,178,138,0.10)";
        else if (peers.has(c)) fill = "rgba(236,231,222,0.065)";
      }
    }
    ctx.fillStyle = fill;
    ctx.fillRect(cellX(c), cellY(c), S, S);
  }

  // A wrong entry pulses briefly, then just stays marked.
  if (flash) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - flash.t / 0.6) * 0.5;
    ctx.fillStyle = WRONG;
    ctx.fillRect(cellX(flash.cell), cellY(flash.cell), S, S);
    ctx.restore();
  }

  ctx.strokeStyle = "rgba(236,231,222,0.10)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 9; i++) {
    if (i % 3 === 0) continue;
    ctx.moveTo(PAD + i * S, PAD); ctx.lineTo(PAD + i * S, PAD + 9 * S);
    ctx.moveTo(PAD, PAD + i * S); ctx.lineTo(PAD + 9 * S, PAD + i * S);
  }
  ctx.stroke();

  ctx.strokeStyle = "rgba(200,178,138,0.42)";
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  for (let i = 0; i <= 9; i += 3) {
    ctx.moveTo(PAD + i * S, PAD); ctx.lineTo(PAD + i * S, PAD + 9 * S);
    ctx.moveTo(PAD, PAD + i * S); ctx.lineTo(PAD + 9 * S, PAD + i * S);
  }
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let c = 0; c < 81; c++) {
    const x = cellX(c) + S / 2, y = cellY(c) + S / 2 + S * 0.03;
    if (entries[c]) {
      const wrong = settings.check && isWrong(c);
      ctx.fillStyle = wrong ? WRONG : (isGiven(c) ? "#ddd6c8" : "#c8b28a");
      ctx.font = (isGiven(c) ? "500 " : "400 ") + Math.round(S * 0.60) +
                 "px -apple-system, Helvetica, Arial, sans-serif";
      ctx.fillText(entries[c], x, y);
    } else if (notes[c]) {
      ctx.fillStyle = "rgba(148,139,126,0.85)";
      ctx.font = "400 " + Math.round(S * 0.24) + "px -apple-system, Helvetica, Arial, sans-serif";
      for (let d = 1; d <= 9; d++) {
        if (!(notes[c] & E.bit(d))) continue;
        const col = (d - 1) % 3, row = ((d - 1) / 3) | 0;
        ctx.fillText(d, cellX(c) + S * (0.22 + 0.28 * col), cellY(c) + S * (0.24 + 0.27 * row));
      }
    }
  }
}

/* ---------- play ---------- */
function record(cell) {
  history.push({ cell, entry: entries[cell], note: notes[cell], mistakes });
  if (history.length > 300) history.shift();
}

const anyNotes = () => notes.some(n => n !== 0);

// Over-notating is easy and undoing it one cell at a time is tedious, so the
// whole board clears in one go. It goes on the undo stack like anything else.
function clearNotes() {
  if (!running || finished || !anyNotes()) return;
  history.push({ notesAll: Int16Array.from(notes), mistakes });
  if (history.length > 300) history.shift();
  notes.fill(0);
  selection = -1;
  sfxClear(); save(); syncUI();
}

function enter(d) {
  if (!running || selection < 0 || isGiven(selection) || finished) return;
  record(selection);
  if (notesMode) {
    notes[selection] ^= E.bit(d);
    entries[selection] = 0;
  } else if (entries[selection] === d) {
    entries[selection] = 0;                       // tap the same digit to clear
  } else {
    entries[selection] = d;
    notes[selection] = 0;
    if (d !== puzzle.solution[selection]) {
      mistakes++;
      flash = { cell: selection, t: 0 };
      sfxWrong();
    } else {
      // Placing a digit clears the obvious pencil marks it rules out.
      for (const p of E.PEERS[selection]) notes[p] &= ~E.bit(d);
      sfxPlace();
    }
  }
  if (solved()) { finished = true; sfxDone(); showFinished(); }
  save(); syncUI();
}

function erase() {
  if (!running || selection < 0 || isGiven(selection)) return;
  record(selection);
  entries[selection] = 0;
  notes[selection] = 0;
  save(); syncUI();
}

function undo() {
  if (!history.length) return;
  const s = history.pop();
  if (s.notesAll) {
    notes.set(s.notesAll);
  } else {
    entries[s.cell] = s.entry;
    notes[s.cell] = s.note;
    selection = s.cell;
  }
  mistakes = s.mistakes;
  finished = false;
  sfxUndo(); save(); syncUI();
}

function placedCount(d) {
  let n = 0;
  for (let c = 0; c < 81; c++) if (entries[c] === d && entries[c] === puzzle.solution[c]) n++;
  return n;
}

function newPuzzle(t) {
  tier = t;
  puzzle = E.generate(tier, (Date.now() ^ (seedCounter++ * 2654435761)) >>> 0);
  entries = Uint8Array.from(puzzle.givens);
  notes = new Int16Array(81);
  selection = -1; mistakes = 0; elapsed = 0; finished = false;
  history = []; flash = null; notesMode = false;
  resize(); save(); syncUI();
}

/* ---------- sound ---------- */
// soundOn is what the player asked for. audioDead is whether the browser can
// do it at all. Keeping them apart matters: the old code turned the player's
// setting off to record its own failure, then saved that as a preference.
let actx = null, soundOn = true, audioDead = false;
let paintSound = () => {};

function audio() {
  if (audioDead) return;
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioDead = true; paintSound(); return; }
  }
  if (actx.state !== "running") actx.resume().then(paintSound, () => {});
}

function emit(f, dur, type, gain, delay) {
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

// A context only starts from inside a gesture, and resume() settles a beat
// after it is asked. A note scheduled in that gap is timed against a clock
// that has not started, so it lands in the past and is dropped without a
// sound or an error. On a phone that was every note. Wait for the resume.
function tone(f, dur, type, gain, delay) {
  if (!soundOn || audioDead || !actx) return;
  if (actx.state === "running") { emit(f, dur, type, gain, delay); return; }
  actx.resume().then(() => {
    if (soundOn && actx.state === "running") emit(f, dur, type, gain, delay);
    paintSound();
  }, () => {});
}
const sfxPlace = () => tone(660, 0.07, "sine", 0.028);
const sfxWrong = () => tone(150, 0.13, "triangle", 0.04);
const sfxUndo  = () => tone(420, 0.08, "sine", 0.026);
const sfxClear = () => { tone(360, 0.09, "sine", 0.024); tone(240, 0.11, "sine", 0.022, 0.05); };
const sfxDone  = () => [0, 4, 7, 12].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), 0.6, "sine", 0.05, i * 0.1));

/* ---------- chrome ---------- */
const $tier = document.getElementById("tierName");
const $clues = document.getElementById("clues");
const $mist = document.getElementById("mistakes");
const $clock = document.getElementById("clock");
const $undo = document.getElementById("undo");
const $notes = document.getElementById("notesBtn");
const $clearNotes = document.getElementById("clearNotes");
const $veil = document.getElementById("veil");
const $keypad = document.getElementById("keypad");

function fmtClock() {
  const t = Math.floor(elapsed);
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

function syncUI() {
  if (!puzzle) return;
  $tier.textContent = E.TIERS[tier].name.toUpperCase();
  $clues.textContent = 81 - entries.reduce((n, v) => n + (v ? 1 : 0), 0);
  $mist.textContent = mistakes;
  $mist.parentElement.style.display = settings.mistakes ? "" : "none";
  $clock.textContent = fmtClock();
  $clock.parentElement.style.display = settings.clock ? "" : "none";
  $undo.disabled = !history.length;
  $clearNotes.disabled = !anyNotes();
  $notes.classList.toggle("on", notesMode);
  [...$keypad.children].forEach((b, i) => {
    const done = placedCount(i + 1) === 9;
    b.disabled = done;
    b.classList.toggle("done", done);
  });
}

function save() {
  try {
    localStorage.setItem("sudoku.save", JSON.stringify({
      puzzle, entries: Array.from(entries), notes: Array.from(notes),
      mistakes, elapsed, tier, settings, soundPref: soundOn
    }));
  } catch (e) {}
}
function restore() {
  let s;
  try { s = JSON.parse(localStorage.getItem("sudoku.save") || "null"); } catch (e) { return false; }
  if (!s || !s.puzzle || !Array.isArray(s.entries) || s.entries.length !== 81) return false;
  puzzle = s.puzzle;
  entries = Uint8Array.from(s.entries);
  notes = Int16Array.from(s.notes || new Array(81).fill(0));
  mistakes = s.mistakes | 0;
  elapsed = s.elapsed || 0;
  tier = s.tier | 0;
  settings = Object.assign({}, DEFAULTS, s.settings || {});
  // s.soundOn is the older key, which a failure could flip off on its own.
  // Only soundPref was ever set by a deliberate press, so only it is honoured.
  if (typeof s.soundPref === "boolean") soundOn = s.soundPref;
  finished = solved();
  return true;
}

window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* ---------- input ---------- */
cv.addEventListener("pointerdown", e => {
  if (!running) return;
  e.preventDefault();
  audio();
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - PAD) / S);
  const y = Math.floor((e.clientY - r.top - PAD) / S);
  if (x < 0 || x > 8 || y < 0 || y > 8) return;
  const c = y * 9 + x;
  selection = selection === c ? -1 : c;
  syncUI();
}, { passive: false });
cv.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("keydown", e => {
  if (!running) return;
  if (e.key >= "1" && e.key <= "9") { enter(+e.key); e.preventDefault(); return; }
  if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") { erase(); e.preventDefault(); return; }
  if (e.key === "n" || e.key === "N") { notesMode = !notesMode; syncUI(); return; }
  if (e.key === "z" || e.key === "Z") { undo(); return; }
  const move = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -9, ArrowDown: 9 }[e.key];
  if (move !== undefined) {
    e.preventDefault();
    if (selection < 0) selection = 40;
    else {
      const n = selection + move;
      const sameRow = Math.abs(move) === 1 && ((n / 9) | 0) === ((selection / 9) | 0);
      if (n >= 0 && n < 81 && (Math.abs(move) === 9 || sameRow)) selection = n;
    }
    syncUI();
  }
});

/* ---------- loop ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - lastTick) / 1000 || 0);
  lastTick = now;
  if (running && !finished) elapsed += dt;
  if (flash) { flash.t += dt; if (flash.t > 0.6) flash = null; }
  if (running && settings.clock) $clock.textContent = fmtClock();
  render(now);
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 140));
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

</script>
<script>
/* ---------- glue: the menu, the picker, and starting up ---------- */
(function () {
  const E = window.SudokuEngine;
  const $veil = document.getElementById("veil");
  const $tiers = document.getElementById("tiers");
  const $opts = document.getElementById("opts");

  const keypad = document.getElementById("keypad");
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement("button");
    b.textContent = d;
    b.addEventListener("click", () => { audio(); enter(d); });
    keypad.appendChild(b);
  }

  document.getElementById("undo").addEventListener("click", () => { audio(); undo(); });
  document.getElementById("erase").addEventListener("click", () => { audio(); erase(); });
  $clearNotes.addEventListener("click", () => { audio(); clearNotes(); });
  document.getElementById("notesBtn").addEventListener("click", () => {
    notesMode = !notesMode; audio(); syncUI();
  });

  const $sound = document.getElementById("sound");
  paintSound = function () {
    $sound.classList.toggle("on", soundOn && !audioDead);
    $sound.classList.toggle("off", !soundOn || audioDead);
    $sound.disabled = audioDead;
    $sound.title = audioDead ? "This browser will not play sound"
                 : soundOn ? "Sound on" : "Sound off";
    $sound.setAttribute("aria-label", $sound.title);
    $sound.setAttribute("aria-pressed", String(soundOn && !audioDead));
  };
  $sound.addEventListener("click", () => {
    soundOn = !soundOn; paintSound(); save();
    // Turning it on plays a note, so the answer to "is this working" is the
    // sound itself rather than the state of a small button.
    if (soundOn) { audio(); sfxPlace(); }
  });

  function buildTiers() {
    $tiers.innerHTML = "";
    E.TIERS.forEach((T, i) => {
      const b = document.createElement("button");
      b.className = "btn" + (i === tier ? " on" : "");
      b.innerHTML = T.name + "<small>" + T.clues + " clues</small>";
      b.addEventListener("click", () => {
        newPuzzle(i);
        buildTiers();
        $veil.classList.remove("on");
        audio(); running = true;
      });
      $tiers.appendChild(b);
    });
  }

  function buildOpts() {
    $opts.innerHTML = "";
    [["Check as you play", "check"], ["Highlights", "highlights"],
     ["Clock", "clock"], ["Mistake count", "mistakes"]]
      .forEach(([label, key]) => {
        const row = document.createElement("div");
        row.className = "opt";
        const s = document.createElement("span"); s.textContent = label;
        const b = document.createElement("button");
        const paint = () => {
          b.textContent = settings[key] ? "On" : "Off";
          b.className = settings[key] ? "on" : "";
        };
        paint();
        b.addEventListener("click", () => { settings[key] = !settings[key]; paint(); save(); syncUI(); });
        row.appendChild(s); row.appendChild(b);
        $opts.appendChild(row);
      });
  }

  function showResume(returning) {
    running = false;
    const left = 81 - entries.reduce((n, v) => n + (v ? 1 : 0), 0);
    document.getElementById("ttl").textContent = returning ? "Welcome back" : "Paused";
    document.getElementById("sttl").textContent =
      returning ? "Your puzzle is where you left it." : "Take your time.";
    document.getElementById("msg").innerHTML =
      E.TIERS[tier].name + ", <b>" + left + "</b> left.<br><br>" +
      "Resume below, or pick a difficulty to start a new one.";
    document.getElementById("play").textContent = "Resume";
    buildTiers(); buildOpts();
    $veil.classList.add("on");
  }

  document.getElementById("menu").addEventListener("click", () => showResume(false));

  document.getElementById("play").addEventListener("click", () => {
    $veil.classList.remove("on"); audio(); running = true;
  });

  window.showFinished = function () {
    running = false;
    document.getElementById("ttl").textContent = "Solved";
    document.getElementById("sttl").textContent = E.TIERS[tier].name + " · " + fmtClock();
    document.getElementById("msg").innerHTML = mistakes
      ? "<b>" + mistakes + "</b> correction" + (mistakes === 1 ? "" : "s") + " along the way."
      : "Straight through, no corrections.";
    document.getElementById("play").textContent = "Another";
    buildTiers(); buildOpts();
    $veil.classList.add("on");
    document.getElementById("play").onclick = () => {
      newPuzzle(tier);
      $veil.classList.remove("on"); audio(); running = true;
      document.getElementById("play").onclick = null;
    };
  };

  // Only greet a puzzle that was actually played. A board dealt and left
  // untouched should open on the welcome copy like any first visit.
  const touched = () => entries.some((v, i) => v !== puzzle.givens[i]) ||
                        notes.some(n => n !== 0);
  let resuming = false;
  if (!restore()) newPuzzle(0);
  else if (finished) newPuzzle(tier);
  else resuming = touched();
  paintSound();
  buildTiers(); buildOpts();
  resize(); syncUI();
  if (resuming) showResume(true);
  requestAnimationFrame(t => { lastTick = t; frame(t); });
})();
</script>
